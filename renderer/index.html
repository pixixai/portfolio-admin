<!-- 视频原色背景，下方操作条与其下的单行介绍。 -->
<div id="home">
  <section class="home-hero home-hero--video" aria-labelledby="home-title" aria-describedby="hero-playback-hint" tabindex="0" data-background-config="{{root}}data/home-background.json">
    <div class="hero-image" aria-hidden="true">
      <img src="{{root}}assets/home/home-background.png" width="3376" height="1440" alt="" fetchpriority="high" decoding="async">
      <video class="hero-video" data-src="{{root}}assets/home/home-background.mp4" muted playsinline preload="auto" tabindex="-1" disablepictureinpicture></video>
      <video class="hero-video" muted playsinline preload="auto" tabindex="-1" disablepictureinpicture></video>
      <img class="hero-slide" alt="" decoding="async">
      <img class="hero-final" alt="" decoding="async">
    </div>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="hero-shell">
      <h1 id="home-title" class="sr-only">{{owner}}的作品集</h1>
      <div class="hero-bottom">
        <div class="home-actions" aria-label="首页入口与联系方式">
          <a class="home-primary" href="#works">浏览作品<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></a>
          <button class="home-wechat" id="copy-wechat" type="button" data-copy-value="{{wechat}}" data-copy-label="微信号" title="点击复制微信号" aria-label="复制微信号：{{wechat}}"><svg class="wechat-icon" viewBox="0 0 1024 1024" aria-hidden="true"><path d="M506.942 345.921c25.259 0 42.134-16.916 42.134-42.107 0-25.477-16.848-41.956-42.134-41.956-25.299 0-50.668 16.48-50.668 41.956 0.028 25.204 25.409 42.107 50.668 42.107l0 0zM506.942 345.921zM271.257 261.857c-25.259 0-50.79 16.48-50.79 41.956 0 25.19 25.532 42.107 50.79 42.107 25.163 0 42.012-16.916 42.012-42.107-0.014-25.477-16.834-41.956-42.012-41.956l0 0zM271.257 261.857zM1010.654 615.492c0-133.202-123.563-246.702-275.237-258.512 0.205-1.652 0.301-3.373-0.068-5.092-30.406-141.79-182.886-248.695-354.7-248.695-194.15 0-352.119 135.387-352.119 301.793 0 89.279 45.574 169.725 131.946 233.158l-30.106 90.508c-1.939 5.885-0.177 12.37 4.506 16.452 2.853 2.458 6.445 3.741 10.076 3.741 2.335 0 4.697-0.546 6.867-1.625l113.036-56.565 13.926 2.827c34.802 7.154 64.853 13.353 101.868 13.353 10.895 0 40.878-3.987 43.404-7.182 40.755 101.99 153.094 175.61 285.273 175.61 33.86 0 68.13-8.164 98.891-15.866l87.136 47.636c2.307 1.257 4.847 1.911 7.359 1.911 3.441 0 6.881-1.161 9.639-3.413 4.847-3.932 6.841-10.404 5.038-16.33l-22.255-74.001c74.602-58.955 115.521-129.488 115.521-199.708l0 0zM409.798 665.75c-9.626 0.833-19.388 1.243-29.082 1.243-32.686 0-60.334-5.652-92.31-12.26l-18.582-3.755c-3.195-0.683-6.567-0.245-9.503 1.269l-81.687 40.892 21.231-63.775c2.076-6.24-0.205-13.053-5.57-16.821-82.07-57.207-123.659-126.894-123.659-207.093 0-144.179 139.087-261.516 310.067-261.516 151.142 0 284.959 91.955 312.579 214.261-158.475 2.076-286.706 113.487-286.706 250.32 0 19.893 3.018 39.171 8.11 57.767-1.542-0.382-3.168-0.683-4.887-0.532l0 0zM860.371 788.699c-4.875 3.673-6.935 10.007-5.188 15.852l13.804 45.903-56.647-30.993c-2.157-1.188-4.588-1.803-7.004-1.803-1.188 0-2.389 0.15-3.564 0.464-30.379 7.674-61.822 15.593-92.433 15.593-142.186 0-257.857-97.717-25           <button class="home-email" id="copy-email" type="button" data-copy-value="{{emailPrimary}}" data-copy-label="邮箱地址" title="点击复制邮箱地址" aria-label="复制邮箱地址：{{emailPrimary}}"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="7" width="24" height="18" rx="3"/><path d="m4 9 12 9L28 9"/></svg><span class="contact-label">{{emailPrimary}}</span></button>
          <button class="home-bilibili" id="copy-bilibili" type="button" data-copy-value="{{bilibiliName}}" data-copy-label="Bilibili 昵称" title="点击复制昵称" aria-label="复制 Bilibili 昵称：{{bilibiliName}}"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m10 3 3 5m9-5-3 5"/><rect x="4" y="8" width="24" height="20" rx="5"/><path d="m10 15 3 1m9-1-3 1m-6 5 3 2 3-2"/></svg><span class="contact-label">{{bilibiliName}}</span></button>
        </div>
        <div class="home-description">
          <p class="home-tagline">一些想法，一些作品。</p>
          <p class="home-identity"><span>你好，我是{{owner}}</span><span>视觉设计师</span></p>
        </div>
      </div>
      <p id="hero-playback-hint" class="sr-only">单击首页空白处，或聚焦首页后按空格键，可播放或暂停背景。全部视频播放完后停留，单击可重新播放。</p>
    </div>
  </section>
  <section id="works" aria-label="作品集" tabindex="-1">
    <h2 class="sr-only">作品集</h2>
    <div class="work-tools">
      <div id="filters" class="filters" role="group" aria-label="筛选作品分类">
        {{filters}}
      </div>
      <span id="result-count" class="result-count" aria-live="polite"
        >{{projectCount}} 件作品</span
      >
    </div>
    <div id="grid" class="grid" aria-label="作品瀑布流">{{cards}}</div>
    <p class="endnote">每一个项目，都是一次新的探索。</p>
  </section>
  <footer id="contact" class="site-footer" aria-label="联系与网站信息" tabindex="-1">
    <div class="footer-line">{{footerCopyright}}<div class="footer-contacts"><button class="footer-copy" type="button" data-copy-value="{{emailPrimary}}" data-copy-label="邮箱地址" aria-label="复制邮箱地址：{{emailPrimary}}"><span class="contact-label">邮箱：{{emailPrimary}}</span></button><span>微信：{{wechat}}</span><span>Bilibili：{{bilibiliName}}</span></div></div>
    {{footerRegistration}}
    <p id="contact-status" class="sr-only" role="status"></p>
  </footer>
</div>
