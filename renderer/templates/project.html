<article class="project-detail" data-project-id="{{id}}">
  <header class="detail-heading">
    <p class="eyebrow">
      {{english}} <span>{{number}} / {{projectCount}}</span>
    </p>
    <h2>{{projectTitle}}</h2>
    <p class="detail-description">{{projectDescription}}</p>
    <div class="detail-tags">{{tags}}</div>
  </header>
  <div class="gallery-note">
    <span>完整作品展示</span><span>点击图片放大查看 ↗</span>
  </div>
  <div class="project-gallery">{{body}}</div>
  <div class="project-finish">
    <p>感谢看到这里。</p>
  </div>
  <section class="related-projects" aria-label="相邻作品">
    <div class="related-heading">
      <h3>继续看看</h3>
      <p>更多想法，继续探索。</p>
    </div>
    <div class="related-grid">{{related}}</div>
  </section>
</article>
